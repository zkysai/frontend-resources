<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
  <script>
    //静态方法: 方法属于类, 通过 类名直接调用.
    function Person(){
    }

    Person.run = function(){
      console.log("run...",this); //this指向Person函数对象
    }
    console.log(Person.run());

    //比如:Math的 random ,abs 等方法
    console.log(Math.random());
    console.log(Math.PI); //静态属性
    console.dir(Math);
  </script>
</body>
</html>
