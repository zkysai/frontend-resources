<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>

  <style>
    *{
      margin: 0;
      padding: 0;
    }

    .bg{
      position: relative;
      width: 1366px;
      height: 600px;
      background: url("./imgs/bg.jpg") no-repeat;
      margin: 0 auto;
      overflow: hidden;
    }

    .bg {
      font-size: 40px;

      .left,.right{
        float:left;
        width: 50%;
        height: 100%;
        /*background-color: rebeccapurple;*/
        /*background-color: #663399;*/
        background: url("./imgs/fm.jpg") no-repeat;
        transition: all .5s; /*给谁加,谁动(的生硬)给谁加*/
      }

      .right{
        background: url("./imgs/fm.jpg") no-repeat right top;
      }
    }

    .bg:hover .left{
      transform: translateX(-100%);
    }

    .bg:hover .right{
      transform: translateX(100%);
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="left">left</div>
    <div class="right">right</div>
  </div>
</body>
</html>
