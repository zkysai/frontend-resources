<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    div{
      width: 100px;
      height: 100px;
      position: absolute;
    }
    /*默认的层级z-index：auto;*/
    /*根据标签的书写顺序排列*/
    /*数字越大，层级越高*/
    .box1{
      background-color: red;
      z-index: 50;
    }

    .box2{
      background-color: green;
      left: 20px;
      top: 20px;
      z-index: 100;
    }

    .box3{
      background-color: blue;
      left: 40px;
      top: 40px;
    }
  </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="box3"></div>
</body>
</html>
