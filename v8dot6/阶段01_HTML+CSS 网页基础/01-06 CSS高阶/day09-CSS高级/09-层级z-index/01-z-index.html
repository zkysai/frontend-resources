<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    div{
      width: 100px;
      height: 100px;
      position: absolute;
    }

    .box1{
      background-color: red;
    }

    .box2{
      background-color: green;
      left: 20px;
      top: 20px;
    }

    .box3{
      background-color: blue;
      left: 40px;
      top: 40px;
    }
  </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="box3"></div>
</body>
</html>
