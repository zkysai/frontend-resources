<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    .box1{
      width:100px;
      height: 100px;
      padding: 10px 20px 30px 40px;
      border-top:10px solid black;
      border-right:20px solid red;
      border-bottom:30px solid green;
      border-left:40px solid yellow;
      margin: 20px;
      background-color: purple;

      overflow: scroll;
    }
  </style>
</head>
<body>
  <div class="box1">
    你好吗2
  </div>

  <script>
    window.addEventListener('DOMContentLoaded',function(){
      let box1 = document.querySelector(".box1");

      console.log(box1.offsetWidth);   //220
      console.log(box1.offsetHeight);  //180
      console.log(box1.offsetLeft);    // 20
      console.log(box1.offsetTop);     //20
      console.log(box1.offsetParent); //父级元素 body
      console.log(box1.offsetParent === document.body); //true
      //offsetWidth = border-left + padding-left + width(可见区域) + padding-right + border-right
      //offsetHeight = border-top + padding-top + height(可见区域) + padding-bottom + border-bottom
    });
  </script>
</body>
</html>
