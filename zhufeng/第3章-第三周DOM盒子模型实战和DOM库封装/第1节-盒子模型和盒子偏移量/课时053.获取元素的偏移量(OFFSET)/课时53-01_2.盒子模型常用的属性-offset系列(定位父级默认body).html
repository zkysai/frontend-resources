<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>定位父级模式body</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    body{
      margin: 20px;
    }

    #box1{
      padding: 40px;
      width: 300px;
      height: 300px;
      border: 40px solid blue;
      background-color: lightskyblue;
      margin: 40px;
    }

  </style>
</head>
<body>
  <div id="box1">
        1、offset系列
  </div>

  <script>
    let _box1 = document.querySelector('#box1');

    console.log(_box1.offsetWidth,_box1.offsetHeight); //140 140
    console.log(_box1.offsetLeft,_box1.offsetTop); // 190 170

    console.log(_box1.offsetParent); //得到的 定位父级是 body
    /**
     * //1、offset系列
     * offsetWidth ： 左边框 + 左填充 + 内容的宽度(width) + 右填充 + 右边框
     * offsetHeight： 上边框 + 上填充 + 内容的高度(height) +下填充 + 下边框
     *                       offsetWidth  <=>   clientWidth+左右边框
     *                       offsetHeight <=>   clientHeight+上下边框
     * offsetWidth/offsetHeight 和 内容是否溢出也没有关系。
     *
     * offsetParent：_box3的offsetParnet是box1 => 当前元素的父级参照物（不是父级元素）
     *        -> 如果没有定位父级，则其offsetParent就是body
     *        -> 想要改变父级参照物(设置定位父级)需要通过position定位来进行改变
     *            position: absolute;
     *            position: relative;
     *            position: fixed;
     *
     * offsetLeft/offsetTop：是用于获取元素相对于其最近的已定位父级参照物的距离
     *              什么距离：当前元素的外边框 距离 父级参照物内边框的偏移量
     *
     * element.offsetParent返回该元素带有定位的父级元素，如果父级元素没有定位则返回body
     * element.offsetTop返回该元素上外边框相对带有定位的父级元素上内边框的偏移，如果父级元素没有定位则返回相对body上方的偏移
     * element.offsetLeft返回该元素左外边框相对带有定位的父级元素左内边框的偏移，如果父级元素没有定位则返回相对body左侧的偏移
     *
     */
  </script>
</body>
</html>
