<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    body{
      font-size: 14px;
      margin: 100px;
    }

    #box3{
      width:200px;
      height: 200px;
      padding:30px;
      margin: 100px;
      border: 10px solid green;
    }
  </style>
</head>
<body>
  <div id="box3">
    //1、offset系列
    //->offsetWidth/offsetHeight：内容的宽度/高度+左右/上下填充+左右/上下边框
    offsetWidth  <=>   clientWidth+左右边框
    offsetHeight <=>   clientHeight+上下边框

    offsetWidth/offsetHeight 和 内容是否溢出也没有关系。
    offsetParent：_box3的offsetParnet是body => 当前元素的父级参照物（不是父级元素）
    offsetLeft/offsetTop：当前元素的外边框距离父级参照物内边框的偏移量
  </div>
  <script>
    let _box3 = document.querySelector('#box3');

    console.log(_box3.offsetLeft,_box3.offsetTop); // 200 100
    /**
     * //1、offset系列
     * offsetWidth ： 左边框+左填充 +内容的宽度(width)+右填充+右边框
     * offsetHeight： 上边框+上填充 + 内容的高度(height) +下填充 + 下边框
     *                       offsetWidth  <=>   clientWidth+左右边框
     *                       offsetHeight <=>   clientHeight+上下边框
     *
     *   offsetWidth/offsetHeight 和 内容是否溢出也没有关系。
     *   offsetParent：_box3的offsetParnet是body => 当前元素的父级参照物（不是父级元素）
     *   offsetLeft/offsetTop：当前元素的外边框距离父级参照物内边框的偏移量
     *
     *   offsetLeft和offsetTop用于获取元素相对于其最近的已定位祖先元素
     *   （position属性为relative、absolute或fixed）的偏移量。
     *   如果没有已定位的祖先元素，则相对于<body>。
     *
     *   注意事项
     *    定位祖先的影响：offsetLeft 和 offsetTop的计算依赖于最近的已定位祖先元素。
     */
  </script>
</body>
</html>
